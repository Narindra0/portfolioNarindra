# Flux A (suite) — la carte du prochain post LinkedIn se fabrique toute seule.
#
# Ce qui tourne ici, 2 h 30 avant Make :
#   1. scripts/notion-to-postcraft.mjs --preparer --mosaique  choisit LA fiche du prochain
#      créneau (publiable, catégorie la moins publiée, puis la plus riche, puis la plus
#      ancienne) et appelle l'API POSTCRAFT en portrait 1080×1350. Depuis le 28/10, le visuel
#      est une MOSAÏQUE : quatre panneaux (le projet, ce qu'il fait, comment il est construit,
#      ce qu'il faut en retenir) recollés dans la même image — l'API LinkedIn joignable depuis
#      Make ne publie qu'un seul média par post, donc « plusieurs visuels » se compose ici.
#      Le PNG est écrit sous assets/visuels-postcraft/. Si un gabarit refuse le texte (422),
#      il essaie la chaîne de repli story → swiss → minimal ; si la mosaïque tombe (500, quota
#      navigateur), le créneau repart en carte unique. Aucun texte n'est inventé : tout vient
#      de la fiche.
#   2. Le PNG est poussé sur la branche « donnees » — donc 0 crédit Netlify, et une URL
#      publique brute que l'API LinkedIn accepte (ShareImage en method:"link" exige une URL).
#   3. scripts/notion-to-postcraft.mjs --armer écrit « Visuel du post », met
#      « Statut LinkedIn = À publier » et « Prêt à publier », et désarme toute autre fiche
#      armée. Le contrôle d'existence de l'URL se fait AVANT l'écriture : pas de fiche armée
#      sur un visuel qui renverrait 404.
#   4. À 09:00 Tana, le scénario Make 8137816 prend l'unique fiche armée, fait rédiger le
#      texte par Gemini, publie le post avec sa carte et consigne l'URN dans Notion — la fiche
#      devient donc ineligible et ne peut pas être postée deux fois.
#
# Pourquoi cet ordre : Make ne trie pas les résultats de sa recherche Notion. Deux fiches
# armées = un créneau publié sur une carte qui ne correspond pas au texte. D'où « une seule
# fiche armée à la fois », imposée ici et vérifiée par --armer.
#
# Anti-boucle : la poussée se fait avec le GITHUB_TOKEN du workflow (GitHub ne relance jamais
# un run pour un push de ce jeton), le déclencheur ne vise aucun push, et « donnees » ne
# construit rien sur Netlify. Le message du commit ne doit PAS contenir la marque « skip ci »
# entre crochets — Netlify et Actions la lisent dans le message et sautent alors leur travail.
#
# Réglages une fois pour toutes :
#   secrets.NOTION_TOKEN    (déjà posé pour le flux B)
#   secrets.POSTCRAFT_KEY   (clé Bearer de l'API du studio, régénérée — jamais dans un fichier)
#   Settings -> Actions -> General -> Workflow permissions : Read and write (déjà réglé)
name: LinkedIn — carte du prochain post

on:
  schedule:
    # 03:30 UTC = 06:30 Antananarivo, les lundi / mercredi / vendredi. Make publie à 06:00 UTC.
    - cron: '30 3 * * 1,3,5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Aperçu sans écriture (--sec) ou cycle complet (préparer + pousser + armer)'
        required: true
        default: completer
        type: choice
        options:
          - completer
          - apercu

permissions:
  contents: write

concurrency:
  group: linkedin-visuels
  cancel-in-progress: false

jobs:
  carte:
    name: Choisir la fiche, rendre la carte, l'héberger, armer Notion
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      POSTCRAFT_KEY: ${{ secrets.POSTCRAFT_KEY }}
      POSTCRAFT_URL: https://postcraft-linkedin-studio.afatra.workers.dev
    steps:
      # fetch-depth: 0 — le rebase d'un clone superficiel n'a pas de base commune avec une
      # branche qui a avancé pendant le run (« donnees » bouge toutes les 15 min avec le flux B).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Vérifier les secrets
        run: |
          if [ -z "$NOTION_TOKEN" ]; then echo "::error::Secret NOTION_TOKEN absent."; exit 1; fi
          if [ -z "$POSTCRAFT_KEY" ]; then echo "::error::Secret POSTCRAFT_KEY absent : Settings -> Secrets and variables -> Actions."; exit 1; fi

      - name: Choisir la fiche et rendre sa carte
        run: |
          set -e
          if [ "${{ github.event.inputs.mode }}" = "apercu" ]; then
            node scripts/notion-to-postcraft.mjs --preparer --mosaique --sec
            exit 0
          fi
          set +e
          node scripts/notion-to-postcraft.mjs --preparer --mosaique
          code=$?
          if [ $code -eq 3 ]; then
            echo "::warning::Reservoir vide : aucune fiche publiable, rien n'est arme ni publie. Completer des fiches Notion (Statut Portfolio = Ajoute + un lien + une accroche)."
            echo "reservoir_vide=1" >> "$GITHUB_ENV"
            exit 0
          fi
          exit $code

      # Le PNG est arrivé non suivi dans l'arbre de travail : on le met à l'abri avant de
      # changer de branche (sinon « checkout -B » refuse d'écraser un fichier déjà suivi sur
      # donnees), puis on le repose une fois sur la bonne branche.
      # PIÈGE VÉRIFIÉ LE 2026-10-26 (run #2) : la branche « donnees » ne porte PAS les scripts à
      # jour — le flux B n'y pousse que data/projects.json, et les PNG s'ajoutent ici. Une fois
      # sur donnees, « node scripts/notion-to-postcraft.mjs » répond MODULE_NOT_FOUND. D'où le
      # retour explicite sur main à la fin de cette étape, sur tous les chemins (poussée faite,
      # carte déjà présente, ou poussée refusée trois fois).
      - name: Pousser la carte sur la branche donnees
        if: env.reservoir_vide != '1' && github.event.inputs.mode != 'apercu'
        run: |
          set -e
          mkdir -p /tmp/carte
          mv assets/visuels-postcraft/*.png /tmp/carte/
          rm -rf assets/visuels-postcraft
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin donnees
          git checkout -B donnees FETCH_HEAD
          mkdir -p assets/visuels-postcraft
          cp /tmp/carte/*.png assets/visuels-postcraft/
          a_changer=0
          if ! git diff --quiet -- assets/visuels-postcraft; then a_changer=1; fi
          if [ -n "$(git ls-files --others --exclude-standard assets/visuels-postcraft)" ]; then a_changer=1; fi
          ok=1
          if [ "$a_changer" = "0" ]; then
            echo "La carte est deja sur donnees : rien a pousser."
          else
            git add assets/visuels-postcraft
            git commit -m "visuel(linkedin) : carte portrait du prochain post"
            ok=""
            for tentative in 1 2 3; do
              if git push origin HEAD:donnees; then ok=1; break; fi
              echo "push refuse (donnees a avance) : on repart de l'etat reel, tentative $tentative"
              git fetch --no-tags origin donnees
              git reset --hard FETCH_HEAD
              mkdir -p assets/visuels-postcraft
              cp /tmp/carte/*.png assets/visuels-postcraft/
              git add assets/visuels-postcraft
              if git diff --cached --quiet; then ok=1; break; fi
              git commit -m "visuel(linkedin) : carte portrait du prochain post"
            done
            if [ -z "$ok" ]; then
              echo "::error::3 tentatives de push sur donnees sans succes."
              git checkout main
              exit 1
            fi
            echo "Carte poussee sur la ref donnees."
          fi
          # --armer a besoin des scripts de main ; on y revient avant de poursuivre.
          git checkout main

      # Preuve avant écriture : ce que LinkedIn va réellement télécharger. raw.githubusercontent
      # peut mettre quelques secondes à servir un fichier qui vient d'être poussé. Ce contrôle
      # passe AVANT « --armer » pour que ses 5 tentatives servent vraiment : --armer ne fait
      # qu'une requête et refuse d'armer sur un 404.
      - name: Contrôler l'URL publique de la carte
        if: env.reservoir_vide != '1' && github.event.inputs.mode != 'apercu'
        run: |
          set -e
          url=$(node -e 'const fs=require("fs");console.log(JSON.parse(fs.readFileSync(".visuel-etat.json","utf8")).url)')
          for tentative in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            type=$(curl -s -o /dev/null -w '%{content_type}' "$url")
            if [ "$code" = "200" ] && echo "$type" | grep -q png; then
              taille=$(curl -s -o /dev/null -w '%{size_download}' "$url")
              echo "OK : $url repond $code $type ($taille octets)."
              exit 0
            fi
            echo "pas encore en ligne ($code $type), tentative $tentative…"
            sleep 10
          done
          echo "::error::$url ne repond pas en PNG apres 5 tentatives : fiche non armee."
          exit 1

      - name: Armer la fiche dans Notion
        if: env.reservoir_vide != '1' && github.event.inputs.mode != 'apercu'
        run: node scripts/notion-to-postcraft.mjs --armer
