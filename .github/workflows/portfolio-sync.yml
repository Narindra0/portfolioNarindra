# Flux B — le portfolio se régénère depuis Notion sans intervention.
# Scanner : tous les dépôts GitHub (publics, + privés si GITHUB_PAT) entrent en fiche Notion.
# Synthèse : data/projects.json est recalculé ; s'il change, le commit fait redéployer Netlify.
# Anti-boucle : le commit du bot porte « [skip ci] » et tout push dont le message contient
# « [skip ci] » est ignoré — le dépôt part en Brouillon.
#
# Réglages obligatoires une fois, dans Settings -> Secrets and variables -> Actions -> Secrets :
#   NOTION_TOKEN   = le ntn_… de l'intégration Notion
#   GITHUB_PAT     = jeton fine-grained « Metadata : Read-only », All repositories, expiration 90 j
#                    (facultatif : sans lui le scanner ne voit que les dépôts publics)
# Et dans Settings -> Actions (pas Settings -> General) -> Workflow permissions : « Read and write ».
name: Portfolio — synchro Notion

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC = 05:00 Antananarivo, filet de sécurité si un push a été manqué
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scan + synthèse (--publish) ou comparaison seule (--check)'
        required: true
        default: publier
        type: choice
        options:
          - publier
          - verifier

permissions:
  contents: write

concurrency:
  group: portfolio-sync
  cancel-in-progress: false

jobs:
  decouverte:
    name: Scanner les dépôts GitHub vers fiches Notion
    runs-on: ubuntu-latest
    # Anti-boucle : un push marqué [skip ci] (celui du bot) ne relance rien.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Vérifier la présence du secret
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "${NOTION_TOKEN}" ]; then
            echo "::error::Secret NOTION_TOKEN absent : Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # Un dépôt public bien décrit part en « À ajouter » ; un dépôt privé, un dépôt sans
      # description ou un nom de la liste d'exclusion ne sortira jamais sur le site sans que
      # Narindra le décide. Les noms privés ne sont jamais écrits dans ce log (public).
      - name: Scanner les dépôts GitHub absents de Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
          GITHUB_OWNER: ${{ vars.GITHUB_OWNER }}
          NOTION_DS: ${{ vars.NOTION_DS }}
        run: node scripts/github-discovery.mjs --create

  sync:
    name: Notion vers data/projects.json puis Netlify
    runs-on: ubuntu-latest
    needs: decouverte
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Régénérer data/projects.json depuis Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DS: ${{ vars.NOTION_DS }}
        run: node scripts/notion-to-projects.mjs ${{ github.event.inputs.mode == 'verifier' && '--check' || '--publish' }}

      # Garde-fou : une base Notion mal lue ne doit pas vider le portfolio en ligne.
      - name: Refuser un résultat vide ou tronqué
        run: |
          node -e '
            const j = JSON.parse(require("fs").readFileSync("data/projects.json", "utf8"));
            if (!Array.isArray(j) || j.length === 0) { console.error("projects.json vide -> abandon"); process.exit(1); }
            console.log("projets publiés :", j.length);
          '
          git diff --stat -- data/projects.json

      - name: Pousser le changement (redéploie Netlify)
        if: ${{ github.event.inputs.mode != 'verifier' }}
        run: |
          if git diff --quiet -- data/projects.json; then
            echo "data/projects.json inchangé : rien à pousser."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json
          git commit -m "sync(portfolio) : projets régénérés depuis Notion [skip ci]"
          git push
